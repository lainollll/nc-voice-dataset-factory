[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nc-voice-dataset-factory"
version = "0.1.0"
description = "Local, resumable voice dataset generation and verification"
requires-python = ">=3.11,<3.12"
dependencies = ["PySide6==6.11.2", "numpy==1.26.4", "scipy==1.13.1", "soundfile==0.13.1", "filelock==3.20.0", "num2words==0.5.14", "requests==2.32.5"]

[project.scripts]
nc-voice-factory = "nc_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nc_factory = ["ui/assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
